name: Desktop pack

# Manual only. A push to main must not stage resources/ or fill Actions storage.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag. Empty runs stage+verify only.
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage-resources:
    name: stage (${{ matrix.platform_key }})
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runs_on: macos-14
            platform_key: darwin-arm64
          # Optional peers (spec 09 §6); enable when signing/assets are ready:
          # - runs_on: macos-13
          #   platform_key: darwin-x64
          # - runs_on: windows-2022
          #   platform_key: win32-x64
          # - runs_on: ubuntu-24.04
          #   platform_key: linux-x64

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install and build web app
        run: pnpm install --frozen-lockfile && pnpm build

      - name: Stage bundled resources (dsh npm tree + semantic runtime)
        env:
          FDE_DOWNLOAD_SEMANTIC_RUNTIME: '1'
          FDE_STAGE_DSH_FROM_NPM: '1'
        run: node scripts/pack/stage.mjs

      - name: Verify resources layout
        run: node scripts/pack/verify.mjs

      - name: Build desktop TypeScript
        working-directory: apps/desktop
        run: npm install && npm run build

      - name: Package Electron app (unsigned when secrets absent)
        id: pack
        working-directory: apps/desktop
        env:
          # Placeholders — wire in org secrets before release/notarize (spec 09 §6 step 3).
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "CSC_LINK not set — skipping electron-builder (stage+verify only)"
            echo "built=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npx electron-builder --config electron-builder.yml
          echo "built=true" >> "$GITHUB_OUTPUT"

      - name: Publish installers to GitHub Release
        if: ${{ steps.pack.outputs.built == 'true' && inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          generate_release_notes: true
          files: |
            apps/desktop/dist-pack/*.dmg
            apps/desktop/dist-pack/*.zip
            apps/desktop/dist-pack/*.exe
            apps/desktop/dist-pack/*.AppImage
            apps/desktop/dist-pack/*.deb
            apps/desktop/dist-pack/latest*.yml
          fail_on_unmatched_files: false
