name: IUI tar sha

# Verification only. Prints the IUI artifact sha256. Does not stage, package, or release.
on:
  workflow_dispatch:
  push:
    branches:
      - cursor/iui-pack-pin-6fc8

permissions:
  contents: read

jobs:
  sha:
    name: sha (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Probe system tar and gzip
        shell: bash
        run: |
          set +e
          echo "uname $(uname -srm)"
          echo "node $(node -v)"
          tar --version 2>&1 | head -n 2
          gzip --version 2>&1 | head -n 2
          mkdir -p "$RUNNER_TEMP/tiny"
          echo hi > "$RUNNER_TEMP/tiny/a.txt"
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner -cf "$RUNNER_TEMP/tiny.tar" -C "$RUNNER_TEMP/tiny" .
          echo "gnu_tar_exit $?"
          node --input-type=module << 'JS'
          import { gzipSync } from 'node:zlib'
          import { createHash } from 'node:crypto'
          import { execFileSync } from 'node:child_process'
          const body = Buffer.alloc(4096)
          for (let i = 0; i < body.length; i += 1) body[i] = (i * 17 + 3) & 0xff
          const sys = execFileSync('gzip', ['-n', '-c'], { input: body })
          const node = gzipSync(body, { level: 6, mtime: 0 })
          const sha = (buf) => createHash('sha256').update(buf).digest('hex')
          console.log(`system_gzip_header ${sys.subarray(0, 10).toString('hex')}`)
          console.log(`system_gzip_sha ${sha(sys)}`)
          console.log(`node_zlib_sha ${sha(node)}`)
          console.log(`system_gzip_eq_node_zlib ${sys.equals(node)}`)
          JS

      - name: Build IUI artifact and print sha256
        shell: bash
        run: |
          corepack enable
          node scripts/pack/build-iui.mjs --out "$RUNNER_TEMP/iui-out"
          echo "pinned 4530e8a9c5f4f29c0bcdd6daa09ef5ee7a615755033991643820d8c1cc294ea5"
