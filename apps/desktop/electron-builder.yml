appId: com.fde-x.workstation
productName: FDE-X
directories:
  output: dist-pack
  buildResources: build
files:
  - dist/**
  - package.json
extraResources:
  - from: ${env.FDE_ELECTRON_RESOURCES}
    to: resources
    filter:
      - "**/*"
      - "!**/.pack-work/**"
afterPack: ./scripts/after-pack-adhoc-sign.mjs
mac:
  icon: build/icon.png
  target:
    - dmg
    - zip
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSUserNotificationAlertStyle: alert
    NSUserNotificationsUsageDescription: 任务完成时在后台提醒你。
win:
  icon: build/icon.png
  target:
    - nsis
    - zip
  artifactName: ${productName}-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: FDE-X
  uninstallDisplayName: FDE-X
