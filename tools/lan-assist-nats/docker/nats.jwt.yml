# JWT memory resolver. Requires `node scripts/nsc-creds.mjs issue` first.
# docker compose -f docker/nats.jwt.yml up -d
services:
  nats:
    image: nats:2.10-alpine
    command: ["-c", "/nsc/resolver.conf", "-js", "-m", "8222"]
    volumes:
      - ../.nsc-local:/nsc:ro
    ports:
      - "4222:4222"
      - "8222:8222"
